<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Recipes</title>
  <link rel="stylesheet" href="css.css">
</head>

<body>

<div class="navbar">
  <div class="wrap nav-row">
    <a class="brand" href="user.html">
      <img src="images/log.png" alt="Ramadan Light logo" class="brand-logo">
      <div class="brand-text">
        <div class="brand-name">Ramadan Light</div>
        <div class="brand-sub">HEALTHY RECIPES</div>
      </div>
    </a>

    <div class="nav-links">
      <a class="link" href="user.html">Home</a>
      <a class="btn btn-primary" href="index.html" data-signout>Log out</a>
    </div>
  </div>
</div>

<div class="mr-container">

  <div class="mr-header">
    <h1 class="mr-title">My Recipes</h1>
    <p class="mr-subtitle">Here are all the recipes you added.</p>
  </div>

  <div class="mr-actions">
    <a href="add-recipe.html" class="mr-btn-primary">+ Add new recipe</a>
  </div>

  <div class="mr-table-box" id="tableBox"></div>

</div>

<div class="footer">
  <div class="wrap footer-row">
    <div class="footer-mark">☾</div>
    <div>©️ 2026 Ramadan Light — Nourishing bodies and souls.</div>
  </div>
</div>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  var esc = RL.esc, img = RL.img;
  var me = RL.requireUser('user', 'You must login first');
  var box = document.getElementById('tableBox');
  var mine = RL.db().recipes.filter(function (r) { return r.userID === me.id; });

  if (!mine.length) {
    box.innerHTML = '<p>You have no recipes.</p>';
    return;
  }

  var rows = mine.map(function (recipe) {
    var video = recipe.videoFilePath
      ? `<a href="#" class="mr-link video-link" data-id="${recipe.id}" target="_blank">View Video</a>`
      : `<span class="mr-link">no video for recipe</span>`;
    return `
          <tr>
            <td>
              <a href="viewrecipe.html?id=${recipe.id}" class="mr-recipe-link">
                <div class="mr-recipe-cell">
                  <img src="${esc(img(recipe.photoFileName))}" alt="${esc(recipe.name)}" class="mr-recipe-img">
                  <div>
                    <div class="mr-recipe-name">${esc(recipe.name)}</div>
                    <div class="mr-recipe-cat">Category: ${esc(RL.category(recipe.categoryID).categoryName)}</div>
                  </div>
                </div>
              </a>
            </td>

            <td>
              <ul class="mr-list">
                ${RL.ingredients(recipe.id).map(function (i) {
                  return `<li>
                    ${esc(i.ingredientName)}
                    ${i.ingredientQuantity ? '— ' + esc(i.ingredientQuantity) : ''}
                  </li>`;
                }).join('')}
              </ul>
            </td>

            <td>
              <ol class="mr-list">
                ${RL.instructions(recipe.id).map(function (s) { return `<li>${esc(s.step)}</li>`; }).join('')}
              </ol>
            </td>

            <td>
              ${video}
            </td>

            <td>${RL.likesCount(recipe.id)}</td>

            <td>
              <a href="edit-recipe.html?id=${recipe.id}" class="mr-link">Edit</a>
            </td>

            <td>
              <a href="#" class="mr-link-danger delete-recipe" data-id="${recipe.id}">Delete</a>
            </td>
          </tr>`;
  }).join('');

  box.innerHTML = `
      <table class="mr-table">
        <tr>
          <th>Recipe</th>
          <th>Ingredients</th>
          <th>Instructions</th>
          <th>Video</th>
          <th>Likes</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
        ${rows}
      </table>`;

  box.querySelectorAll('.video-link').forEach(function (a) {
    RL.videoHref(RL.recipe(parseInt(a.getAttribute('data-id'), 10))).then(function (href) { a.href = href; });
  });

  box.addEventListener('click', function (e) {
    var link = e.target.closest('.delete-recipe');
    if (!link) return;
    e.preventDefault();
    if (confirm('Are you sure you want to delete this recipe?')) {
      if (RL.deleteRecipe(me.id, parseInt(link.getAttribute('data-id'), 10))) {
        link.closest('tr').remove();
        if (!box.querySelectorAll('.delete-recipe').length) box.innerHTML = '<p>You have no recipes.</p>';
      } else {
        alert('Delete failed.');
      }
    }
  });
})();
</script>

</body>
</html>
